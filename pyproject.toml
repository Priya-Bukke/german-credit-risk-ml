[project]
name = "german-credit-risk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Priya Bukke", email = "priyabukke2024@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "mlflow>=2.17,<3",
    "optuna>=4.9.0",
    "pandas>=2.2,<3",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "setuptools>=84.0.0",
    "ucimlrepo>=0.0.7",
    "joblib>=1.5.3",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
